name: Build M-R Archiver APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/mrarchiver

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MRArchiver"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mrarchiver"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.mrarchiver"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="M-R Archiver"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mrarchiver/MainActivity.kt <<'EOF'
          package com.mrarchiver

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.graphics.Color
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var info: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(20, 22, 30)
                  window.navigationBarColor = Color.rgb(20, 22, 30)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 24, 18, 18)
                      setBackgroundColor(Color.rgb(20, 22, 30))
                  }

                  val title = TextView(this).apply {
                      text = "M-R Archiver"
                      textSize = 27f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 8, 0, 20)
                  }
                  root.addView(title)

                  info = TextView(this).apply {
                      text = "Mobile File Manager"
                      textSize = 15f
                      setTextColor(Color.LTGRAY)
                      setPadding(4, 8, 4, 16)
                  }
                  root.addView(info)

                  val scroll = ScrollView(this)
                  val items = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  fun addAction(label: String, action: () -> Unit) {
                      val button = Button(this).apply {
                          text = label
                          isAllCaps = false
                          setOnClickListener { action() }
                      }
                      items.addView(
                          button,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                      )
                  }

                  fun pickFile(mime: String, label: String) {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = mime
                      }
                      try {
                          startActivityForResult(intent, 100)
                          info.text = "Selected category: $label"
                      } catch (e: Exception) {
                          info.text = "Unable to open file picker."
                      }
                  }

                  addAction("Browse Files") {
                      pickFile("*/*", "Files")
                  }

                  addAction("Photos") {
                      pickFile("image/*", "Photos")
                  }

                  addAction("Videos") {
                      pickFile("video/*", "Videos")
                  }

                  addAction("Music") {
                      pickFile("audio/*", "Music")
                  }

                  addAction("ZIP Archives") {
                      pickFile("application/zip", "ZIP archives")
                  }

                  addAction("Device Information") {
                      info.text = "Device: ${android.os.Build.MODEL}\n" +
                          "Android: ${android.os.Build.VERSION.RELEASE}\n" +
                          "App version: 1.0"
                  }

                  addAction("App Settings") {
                      startActivity(
                          Intent(
                              android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                              android.net.Uri.parse("package:$packageName")
                          )
                      )
                  }

                  scroll.addView(items)

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  setContentView(root)
              }

              @Deprecated("Deprecated in Android")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 100 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      info.text = "Selected file:\n$uri"
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-Archiver-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
